spring.application.name=archyra

spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/archyra
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# --- Neo4j (code graph) ---
# Required in .env or the environment: NEO4J_PASSWORD. Optional: NEO4J_URI, NEO4J_USERNAME
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
# The graph is written with Neo4jClient (Cypher), not Spring Data repositories.
spring.data.neo4j.repositories.type=none

# --- Analysis pipeline ---
# Tree-sitter native libraries, built by scripts/build-native.sh (relative to the working directory)
archyra.parsing.native-library-dir=${NATIVE_LIB_DIR:native}
# Ingestion limits (defaults: 10000 files, 200 MB, 1 MB per source file, 2 minute clone)
#archyra.ingestion.max-files=10000
#archyra.ingestion.max-repository-bytes=209715200
#archyra.ingestion.max-source-file-bytes=1048576
#archyra.ingestion.clone-timeout=2m

# --- Usage limits ---
# Lifetime allowances for users on the FREE plan (not monthly: they never reset). PREMIUM users are never capped.
# Both are required, must be 0 or more, and a missing or negative value fails startup.
archyra.usage.free-tier.repository-analysis-limit=${ANALYSIS_LIMIT}
archyra.usage.free-tier.ai-query-limit=${AI_LIMIT}
# Deleting an account keeps what it consumed (a usage ledger of keyed hashes and counts, no email or content) so deleting and
# registering again does not reset the allowances. USAGE_LEDGER_SECRET is the HMAC key of those hashes: required, at least 32
# bytes (openssl rand -base64 48). Changing it later makes the existing ledger entries unmatchable, so keep it stable.
archyra.usage.ledger-secret=${USAGE_LEDGER_SECRET}

# --- AI (Ask AI) ---
# A chain of free LLM providers, tried in `order` (see README -> Ask AI and spec/ask-ai-providers/spec.md). Keys come from the
# environment and may be empty: a provider without a key is simply not in the chain (no key at all means chat answers 503
# AI_UNAVAILABLE without charging). Model ids, base URLs and free-tier limits change often: check each provider's docs and keep
# them here, never in Java. Adding a provider that speaks the OpenAI chat-completions protocol is one block like these plus its
# id in `order`. For every block: requests-per-minute, max-concurrent, max-requests-per-day and max-requests-per-month are LOCAL
# limits that keep us from burning a free quota (0 = none; the day and month are UTC and the counters reset on restart);
# max-context-tokens is the context budget of one prompt for that provider (estimated tokens); logs-prompts records that the
# provider's terms say free-tier prompts may be logged or used for training.
archyra.ai.providers.order=${AI_PROVIDER_ORDER:gemini,groq,openrouter,cloudflare,zai,cohere,ovh,llm7}
archyra.ai.providers.max-attempts=4
archyra.ai.providers.default-max-context-tokens=4000
# A 429 cools a provider down for its Retry-After (else cooldown-default); repeated 429s double it up to cooldown-max.
archyra.ai.providers.cooldown-default=30s
archyra.ai.providers.cooldown-max=1h
# A bad key (401/402/403) or an unknown model (404) cools a provider down for this long, with an ERROR log.
archyra.ai.providers.cooldown-misconfigured=30m
# One attempt gets an equal share of the time left among the providers still to try, but never less than this.
archyra.ai.providers.min-attempt-timeout=10s

# Gemini (Google AI Studio): dedicated adapter. Free-tier prompts may be used by Google to improve its products, and its terms
# require a paid service when the app is exposed to users in the EEA, Switzerland or the UK. Free limits are no longer
# published (check AI Studio); the minute limit below is a cautious local guess.
archyra.ai.providers.gemini.protocol=gemini
archyra.ai.providers.gemini.display-name=Gemini
archyra.ai.providers.gemini.api-key=${GEMINI_API_KEY:}
archyra.ai.providers.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
archyra.ai.providers.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
archyra.ai.providers.gemini.max-context-tokens=12000
archyra.ai.providers.gemini.requests-per-minute=10
archyra.ai.providers.gemini.logs-prompts=true

# Groq (free plan, openai/gpt-oss-120b: 30 requests/min, 1,000/day, 8,000 tokens/min, 200,000/day). One request larger than the
# per-minute token limit can never succeed, hence the small context budget. The base URL ends in /v1: the client appends only
# /chat/completions. Reasoning models count their thinking against the output limit; "low" keeps answers from being cut off.
archyra.ai.providers.groq.display-name=Groq
archyra.ai.providers.groq.api-key=${GROQ_API_KEY:}
archyra.ai.providers.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
archyra.ai.providers.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
archyra.ai.providers.groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}
archyra.ai.providers.groq.max-context-tokens=4500
archyra.ai.providers.groq.requests-per-minute=30
archyra.ai.providers.groq.max-requests-per-day=1000

# OpenRouter: ONLY models whose id ends in ":free" (startup refuses anything else). Free limits: 20 requests/min and 50/day
# (1,000/day once 10 credits were ever bought: raise max-requests-per-day then). Free providers may log prompts for training.
archyra.ai.providers.openrouter.display-name=OpenRouter
archyra.ai.providers.openrouter.api-key=${OPENROUTER_API_KEY:}
archyra.ai.providers.openrouter.model=${OPENROUTER_MODEL:google/gemma-4-31b-it:free}
archyra.ai.providers.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
archyra.ai.providers.openrouter.max-context-tokens=8000
archyra.ai.providers.openrouter.requests-per-minute=20
archyra.ai.providers.openrouter.max-requests-per-day=${OPENROUTER_MAX_REQUESTS_PER_DAY:50}
archyra.ai.providers.openrouter.logs-prompts=true

# Cloudflare Workers AI: 10,000 neurons/day (reset 00:00 UTC; beyond it requests fail, nothing is billed). llama-3.3-70b costs
# about 26.7 neurons per 1K input and 204.8 per 1K output tokens, so a 5K-token question with a 600-token answer costs about 260:
# about 40 requests a day. The account id is part of the base URL: without CLOUDFLARE_ACCOUNT_ID the provider stays out.
archyra.ai.providers.cloudflare.display-name=Cloudflare Workers AI
archyra.ai.providers.cloudflare.api-key=${CLOUDFLARE_API_TOKEN:}
archyra.ai.providers.cloudflare.model=${CLOUDFLARE_MODEL:@cf/meta/llama-3.3-70b-instruct-fp8-fast}
archyra.ai.providers.cloudflare.base-url=${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:}/ai/v1}
archyra.ai.providers.cloudflare.max-context-tokens=5000
archyra.ai.providers.cloudflare.requests-per-minute=20
archyra.ai.providers.cloudflare.max-requests-per-day=40

# Z AI (Zhipu), international endpoint. The free GLM Flash models allow ONE concurrent request. They think by default, which
# eats the output limit, so thinking is switched off.
archyra.ai.providers.zai.display-name=Z AI
archyra.ai.providers.zai.api-key=${ZAI_API_KEY:}
archyra.ai.providers.zai.model=${ZAI_MODEL:glm-4.7-flash}
archyra.ai.providers.zai.base-url=${ZAI_BASE_URL:https://api.z.ai/api/paas/v4}
archyra.ai.providers.zai.extra-body={"thinking":{"type":"disabled"}}
archyra.ai.providers.zai.max-context-tokens=6000
archyra.ai.providers.zai.max-concurrent=1
archyra.ai.providers.zai.requests-per-minute=10

# Cohere through its OpenAI-compatibility endpoint. TRIAL KEYS ARE FOR NON-COMMERCIAL USE ONLY (a warning is logged at startup).
# 1,000 calls/month and 20 requests/min. Its reasoning_effort accepts only none/high, so none is sent.
archyra.ai.providers.cohere.display-name=Cohere
archyra.ai.providers.cohere.api-key=${COHERE_API_KEY:}
archyra.ai.providers.cohere.model=${COHERE_MODEL:command-a-plus-05-2026}
archyra.ai.providers.cohere.base-url=${COHERE_BASE_URL:https://api.cohere.ai/compatibility/v1}
archyra.ai.providers.cohere.max-context-tokens=6000
archyra.ai.providers.cohere.requests-per-minute=20
archyra.ai.providers.cohere.max-requests-per-month=1000

# OVHcloud AI Endpoints, ANONYMOUS ONLY: no Authorization header is ever sent (keyed use is pay-as-you-go and needs a payment
# method; a key set here is ignored). Anonymous limit: 2 requests/min per IP and model. Set OVH_ENABLED=false to leave it out.
archyra.ai.providers.ovh.enabled=${OVH_ENABLED:true}
archyra.ai.providers.ovh.display-name=OVHcloud AI Endpoints
archyra.ai.providers.ovh.auth=none
archyra.ai.providers.ovh.model=${OVH_MODEL:Meta-Llama-3_3-70B-Instruct}
archyra.ai.providers.ovh.base-url=${OVH_BASE_URL:https://oai.endpoints.kepler.ai.cloud.ovh.net/v1}
archyra.ai.providers.ovh.max-context-tokens=6000
archyra.ai.providers.ovh.requests-per-minute=2

# LLM7.io: needs a free token. 60 requests/min and 100,000 tokens per 24 h (about 15 questions a day at this context size). The
# catalogue and the free quota change without notice, and no privacy statement was found.
archyra.ai.providers.llm7.display-name=LLM7
archyra.ai.providers.llm7.api-key=${LLM7_API_KEY:}
archyra.ai.providers.llm7.model=${LLM7_MODEL:mistral-Nemo-Instruct-2407}
archyra.ai.providers.llm7.base-url=${LLM7_BASE_URL:https://api.llm7.io/v1}
archyra.ai.providers.llm7.max-context-tokens=4500
archyra.ai.providers.llm7.requests-per-minute=30
archyra.ai.providers.llm7.max-requests-per-day=15

# --- Opt-in providers: OFF unless enabled=true is set (a warning is logged). A listed or unlisted enabled one joins the chain
# after the listed ones. Read each provider's data policy first.
# NVIDIA NIM: hosted endpoints are for prototyping and log submitted data to improve NVIDIA products ("do not submit personal
# or confidential data"); production use needs an NVIDIA AI Enterprise licence.
archyra.ai.providers.nvidia-nim.enabled=${NVIDIA_NIM_ENABLED:false}
archyra.ai.providers.nvidia-nim.display-name=NVIDIA NIM
archyra.ai.providers.nvidia-nim.api-key=${NVIDIA_NIM_API_KEY:}
archyra.ai.providers.nvidia-nim.model=${NVIDIA_NIM_MODEL:openai/gpt-oss-20b}
archyra.ai.providers.nvidia-nim.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
archyra.ai.providers.nvidia-nim.max-context-tokens=6000
archyra.ai.providers.nvidia-nim.requests-per-minute=10
archyra.ai.providers.nvidia-nim.logs-prompts=true
# Kilo gateway: no key needed (one is sent when set); 200 requests/hour per IP. Its free router may use providers that log
# prompts and outputs.
archyra.ai.providers.kilo.enabled=${KILO_ENABLED:false}
archyra.ai.providers.kilo.display-name=Kilo
archyra.ai.providers.kilo.auth=optional
archyra.ai.providers.kilo.api-key=${KILO_API_KEY:}
archyra.ai.providers.kilo.model=${KILO_MODEL:kilo-auto/free}
archyra.ai.providers.kilo.base-url=${KILO_BASE_URL:https://api.kilo.ai/api/gateway}
archyra.ai.providers.kilo.max-context-tokens=6000
archyra.ai.providers.kilo.requests-per-minute=3
archyra.ai.providers.kilo.logs-prompts=true
# Gonka broker: the key needs SMS verification with a real (non-VoIP) phone number; about 1M tokens a month, shared.
archyra.ai.providers.gonka.enabled=${GONKA_ENABLED:false}
archyra.ai.providers.gonka.display-name=Gonka
archyra.ai.providers.gonka.api-key=${GONKA_API_KEY:}
archyra.ai.providers.gonka.model=${GONKA_MODEL:zai-org/GLM-5.3-Flash}
archyra.ai.providers.gonka.base-url=${GONKA_BASE_URL:https://proxy.gonkabroker.com/v1}
archyra.ai.providers.gonka.max-context-tokens=4500
archyra.ai.providers.gonka.requests-per-minute=5

# The retry template under Spring AI's Gemini model logs the failure it catches at DEBUG, and the Gemini SDK's exception message
# carries the provider's error body. Never log a provider's response body: keep that logger quiet even if the root level is raised.
logging.level.org.springframework.core.retry=INFO
archyra.ai.timeout.connect=5s
archyra.ai.timeout.read=40s
archyra.ai.timeout.total=60s
archyra.ai.answer.max-output-tokens=1024
archyra.ai.history.turns=4
archyra.ai.history.max-tokens=1500
archyra.ai.retrieval.vector-top-k=12
# 0.25: real hits on a sample repository score 0.30-0.58, noise just above 0.15.
# Calibrated with the real embedding model (Architecture.md -> Ask AI): off-topic questions peak at 0.16 on the sample repository, the vaguest
# on-topic one at 0.29. It decides which chunks are shown AND whether a question that names no node is answerable at all: with no chunk at
# least this close it is refused (422 QUESTION_NOT_ANSWERABLE) before anything is sent to a provider or counted.
archyra.ai.retrieval.min-similarity=0.23
# Only this many of the best vector hits are expanded into graph facts (named and cited nodes always are): facts rank above
# chunks, so expanding every hit could fill a small provider budget with facts alone.
archyra.ai.retrieval.vector-seeds-expanded=5
archyra.ai.retrieval.name-lookup-max-nodes=8
archyra.ai.retrieval.neighbors-per-node=6
archyra.ai.chunk.max-chars=6000
archyra.ai.chunk.max-per-analysis=20000
# Local embeddings (ONNX, in the JVM). The model is downloaded once into cache-dir and used offline afterwards; see
# scripts/fetch-embedding-model.sh. The vector size (384) is fixed by the code_chunks column; startup fails if the model differs.
archyra.ai.embedding.batch-size=32
archyra.ai.embedding.model-uri=${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
archyra.ai.embedding.tokenizer-uri=${EMBEDDING_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json}
archyra.ai.embedding.cache-dir=${EMBEDDING_CACHE_DIR:models}
archyra.ai.embedding.verify-on-startup=true
archyra.ai.cache.ttl=1h
archyra.ai.cache.max-entries=500
archyra.ai.limits.message-max-chars=2000
archyra.ai.limits.conversations-per-analysis=50
archyra.ai.limits.messages-per-conversation=100

# --- Security (see specs/security/spec.md and .env.example) ---
# JWT_SECRET is required: base64 of at least 32 random bytes (openssl rand -base64 32).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:archyra}
app.security.jwt.access-token-ttl=15m

app.security.refresh-token.ttl=7d
app.security.refresh-token.cookie-name=refresh_token
app.security.refresh-token.cookie-path=/api/v1/auth
# Set COOKIE_SECURE=false in .env only for local development over plain HTTP (refused under the prod profile).
app.security.refresh-token.cookie-secure=${COOKIE_SECURE:true}

app.security.verification-token-ttl=24h
app.security.password-reset-token-ttl=30m

app.security.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.oauth2.success-redirect-path=/auth/callback
app.security.oauth2.failure-redirect-path=/login

app.security.rate-limit.login-per-ip-per-minute=10
app.security.rate-limit.sensitive-per-ip-per-hour=5
app.security.rate-limit.create-analysis-per-user-per-hour=10
app.security.rate-limit.ai-chat-per-user-per-minute=10
app.security.lockout.max-failed-attempts=5
app.security.lockout.lock-duration=15m

# Optional: creates an ADMIN at startup when none exists.
app.security.bootstrap-admin.email=${ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Behind a reverse proxy, let Tomcat's RemoteIpValve read X-Forwarded-For/-Proto/-Host. Unlike "framework" (Spring's
# ForwardedHeaderFilter, which in Spring 7 replaces the client address from the header with no trust check, so anyone
# could pick their own IP and dodge the rate limits), the valve believes those headers only from internal proxies:
# private and loopback addresses by default, or whatever server.tomcat.remoteip.internal-proxies (a regex) lists.
# With it the request's remote address is the real client, and OAuth2 redirect URIs use the public scheme and host.
server.forward-headers-strategy=native

# --- OAuth2 login (register {API_BASE_URL}/login/oauth2/code/{google|github} with each provider) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# --- Mail ---
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@archyra.local}
