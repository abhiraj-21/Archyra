spring.application.name=archyra

spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/archyra
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# --- Neo4j (code graph) ---
# Required in .env or the environment: NEO4J_PASSWORD. Optional: NEO4J_URI, NEO4J_USERNAME
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
# The graph is written with Neo4jClient (Cypher), not Spring Data repositories.
spring.data.neo4j.repositories.type=none

# --- Analysis pipeline ---
# Tree-sitter native libraries, built by scripts/build-native.sh (relative to the working directory)
archyra.parsing.native-library-dir=${NATIVE_LIB_DIR:native}
# Ingestion limits (defaults: 10000 files, 200 MB, 1 MB per source file, 2 minute clone)
#archyra.ingestion.max-files=10000
#archyra.ingestion.max-repository-bytes=209715200
#archyra.ingestion.max-source-file-bytes=1048576
#archyra.ingestion.clone-timeout=2m

# --- Usage limits ---
# Lifetime allowances for users on the FREE plan (not monthly: they never reset). PREMIUM users are never capped.
# Both are required, must be 0 or more, and a missing or negative value fails startup.
archyra.usage.free-tier.repository-analysis-limit=${ANALYSIS_LIMIT}
archyra.usage.free-tier.ai-query-limit=${AI_LIMIT}

# --- AI (Ask AI) ---
# Keys come from the environment and may be empty: a provider without a key is simply not used (no key at all means
# chat answers 503 AI_UNAVAILABLE without charging). Model ids and free-tier limits change often: check the providers'
# docs (see README) and keep them here, never in Java. Gemini is the primary provider, Groq the fallback.
archyra.ai.gemini.api-key=${GEMINI_API_KEY:}
archyra.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
archyra.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
archyra.ai.groq.api-key=${GROQ_API_KEY:}
archyra.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
archyra.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
archyra.ai.timeout.connect=5s
archyra.ai.timeout.read=40s
archyra.ai.timeout.total=60s
archyra.ai.provider.cooldown-default=30s
archyra.ai.provider.cooldown-max=60s
archyra.ai.answer.max-output-tokens=1024
# Context budgets in estimated tokens. Groq's free plan allows only ~8,000 tokens per minute on its models, and a single
# request larger than that can never succeed, hence the small budget.
archyra.ai.context.gemini-max-tokens=12000
archyra.ai.context.groq-max-tokens=4500
archyra.ai.history.turns=4
archyra.ai.retrieval.vector-top-k=12
archyra.ai.retrieval.min-similarity=0.15
archyra.ai.retrieval.name-lookup-max-nodes=8
archyra.ai.retrieval.neighbors-per-node=6
archyra.ai.chunk.max-chars=6000
archyra.ai.chunk.max-per-analysis=20000
# Local embeddings (ONNX, in the JVM). The model is downloaded once into cache-dir and used offline afterwards; see
# scripts/fetch-embedding-model.sh. The vector size (384) is fixed by the code_chunks column; startup fails if the model differs.
archyra.ai.embedding.batch-size=32
archyra.ai.embedding.model-uri=${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx}
archyra.ai.embedding.tokenizer-uri=${EMBEDDING_TOKENIZER_URI:https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json}
archyra.ai.embedding.cache-dir=${EMBEDDING_CACHE_DIR:models}
archyra.ai.embedding.verify-on-startup=true
archyra.ai.cache.ttl=1h
archyra.ai.cache.max-entries=500
archyra.ai.limits.message-max-chars=2000
archyra.ai.limits.conversations-per-analysis=50
archyra.ai.limits.messages-per-conversation=100

# --- Security (see specs/security/spec.md and .env.example) ---
# JWT_SECRET is required: base64 of at least 32 random bytes (openssl rand -base64 32).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:archyra}
app.security.jwt.access-token-ttl=15m

app.security.refresh-token.ttl=7d
app.security.refresh-token.cookie-name=refresh_token
app.security.refresh-token.cookie-path=/api/v1/auth
# Set COOKIE_SECURE=false in .env only for local development over plain HTTP (refused under the prod profile).
app.security.refresh-token.cookie-secure=${COOKIE_SECURE:true}

app.security.verification-token-ttl=24h
app.security.password-reset-token-ttl=30m

app.security.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.oauth2.success-redirect-path=/auth/callback
app.security.oauth2.failure-redirect-path=/login

app.security.rate-limit.login-per-ip-per-minute=10
app.security.rate-limit.sensitive-per-ip-per-hour=5
app.security.rate-limit.create-analysis-per-user-per-hour=10
app.security.lockout.max-failed-attempts=5
app.security.lockout.lock-duration=15m

# Optional: creates an ADMIN at startup when none exists.
app.security.bootstrap-admin.email=${ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Behind a reverse proxy, let Tomcat's RemoteIpValve read X-Forwarded-For/-Proto/-Host. Unlike "framework" (Spring's
# ForwardedHeaderFilter, which in Spring 7 replaces the client address from the header with no trust check, so anyone
# could pick their own IP and dodge the rate limits), the valve believes those headers only from internal proxies:
# private and loopback addresses by default, or whatever server.tomcat.remoteip.internal-proxies (a regex) lists.
# With it the request's remote address is the real client, and OAuth2 redirect URIs use the public scheme and host.
server.forward-headers-strategy=native

# --- OAuth2 login (register {API_BASE_URL}/login/oauth2/code/{google|github} with each provider) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# --- Mail ---
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@archyra.local}
