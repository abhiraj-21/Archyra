# Every Spring context of the integration tests holds a PostgreSQL and a Neo4j container. Spring keeps up to 32 contexts cached by
# default, which on an 8 GB Docker VM means dozens of containers alive at once: the kernel then OOM-kills the biggest (Neo4j), and
# whatever test next reuses that cached context fails with "connection refused". Old contexts are closed (and their containers
# stopped) instead, at the price of rebuilding one now and then.
spring.test.context.cache.maxSize=6
