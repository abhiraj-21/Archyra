# Placeholders that application.properties expects from .env. The Testcontainers service
# connections supply the real connection details, so these values are never used to connect.
DB_USERNAME=test
DB_PASSWORD=test
NEO4J_PASSWORD=test

# Security placeholders: never used against a real provider or mail server.
# base64 of a 32-byte test key; only for tests.
JWT_SECRET=YXJjaHlyYS10ZXN0LW9ubHktc2VjcmV0LWtleS0zMmI=
# Keyed-hash secret of the usage ledger; only for tests.
USAGE_LEDGER_SECRET=archyra-test-only-usage-ledger-secret-0123456789
COOKIE_SECURE=false
GOOGLE_CLIENT_ID=test-google-client
GOOGLE_CLIENT_SECRET=test-google-secret
GITHUB_CLIENT_ID=test-github-client
GITHUB_CLIENT_SECRET=test-github-secret
SMTP_AUTH=false
SMTP_STARTTLS=false

# Every MockMvc request comes from 127.0.0.1, so the default limits would throttle the whole suite.
# RateLimitingIntegrationTest sets its own low limits.
app.security.rate-limit.login-per-ip-per-minute=100000
app.security.rate-limit.sensitive-per-ip-per-hour=100000
app.security.rate-limit.create-analysis-per-user-per-hour=100000
app.security.rate-limit.link-intent-per-user-per-hour=100000

# Most integration tests start many analyses as one user, so the default free-tier allowance would stop them.
# The usage tests bind their own small limits (see UsageIntegrationSupport) and prove the enforcement.
archyra.usage.free-tier.repository-analysis-limit=100000
archyra.usage.free-tier.ai-query-limit=100000

# Loading the ~90 MB ONNX model in every cached Spring context would be slow; the embedding model loads on first use
# and the AI tests that need it (and the startup check test) turn this on.
archyra.ai.embedding.verify-on-startup=false

# The sweeper that resumes interrupted indexes must not fire in the middle of unrelated tests; the index tests call it directly.
archyra.ai.index.sweep-interval=1h

# Ask AI chat: the default 10 questions a minute would throttle tests that ask several in a row. The rate limit test binds its own.
app.security.rate-limit.ai-chat-per-user-per-minute=100000

# Ask AI providers: the tests never reach a real provider. OVHcloud is the one provider that needs no key, so it would be in the
# chain (and go to the internet) by default; the tests that exercise it switch it on and point it at a fake server.
archyra.ai.providers.ovh.enabled=false
# The local per-provider limits (requests per minute, day, month) protect real free quotas. Tests ask dozens of questions within a
# minute through the same fake providers, so they are off here; the tests of the limits bind their own (ProviderChainTest).
archyra.ai.providers.gemini.requests-per-minute=0
archyra.ai.providers.groq.requests-per-minute=0
archyra.ai.providers.groq.max-requests-per-day=0
archyra.ai.providers.openrouter.requests-per-minute=0
archyra.ai.providers.openrouter.max-requests-per-day=0
archyra.ai.providers.zai.requests-per-minute=0
archyra.ai.providers.zai.max-concurrent=0

# Billing: off unless a test turns it on (BillingIntegrationSupport points it at a WireMock fake of Razorpay). The lifecycle sweep must
# not fire in the middle of unrelated tests; the lifecycle tests call it directly.
archyra.billing.sweep-interval=1h
app.security.rate-limit.billing-create-per-user-per-hour=100000
app.security.rate-limit.billing-verify-per-user-per-hour=100000
app.security.rate-limit.billing-webhook-per-ip-per-minute=100000
# Never the developer's keys from .env: billing is off here; the billing tests set their own test keys.
archyra.billing.razorpay.key-id=
archyra.billing.razorpay.key-secret=
archyra.billing.razorpay.webhook-secret=
archyra.billing.razorpay.plan-monthly=
archyra.billing.razorpay.plan-yearly=
