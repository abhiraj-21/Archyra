<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Coral felt desk: the cotton recipe at a coarser cloud (0.018). Tint via colour matrix only. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="5" stitchTiles="stitch" result="cloud"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0.07 0" result="cloudTint"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="9" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.28  0 0 0 0 0.22  0 0 0 0.08 -0.02" result="grainTint"/>
    <feMerge><feMergeNode in="cloudTint"/><feMergeNode in="grainTint"/></feMerge>
  </filter>
  <rect width="360" height="360" filter="url(#f)"/>
</svg>
