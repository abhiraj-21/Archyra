<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Coral cotton stock: two stitched turbulence layers (cloud 0.011, grain 0.92) and stretched fibres. The tint is a
       colour matrix (warm, faint); no colour literal lives here. -->
  <filter id="c" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" stitchTiles="stitch" result="cloud"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.27  0 0 0 0.05 0" result="cloudTint"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="1" seed="3" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0.07 -0.015" result="grainTint"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="2" seed="11" stitchTiles="stitch" result="fibre"/>
    <feColorMatrix in="fibre" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.33  0 0 0 0 0.26  0 0 0 0.09 -0.04" result="fibreTint"/>
    <feMerge><feMergeNode in="cloudTint"/><feMergeNode in="grainTint"/><feMergeNode in="fibreTint"/></feMerge>
  </filter>
  <rect width="360" height="360" filter="url(#c)"/>
</svg>
